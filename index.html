<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sosis Bakar Yummy Choice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1E5BC6;--blue2:#2463C8;--red:#E5322D;--yellow:#FFC928;--ink:#2B2D42;
  --green:#22B573;--cream:#FFF7E8;--spring:cubic-bezier(.34,1.56,.64,1);--smooth:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
/* ===== Ukuran game di LMS: ubah dua nilai ini bila perlu ===== */
:root{--game-w:100%;--game-h:220px}
html,body{margin:0;overflow:hidden;background:#16428c}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
button{font-family:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;color:inherit}
textarea,input{-webkit-user-select:text;user-select:text;font-family:inherit}

/* ---------- App frame ---------- */
#app{position:relative;width:var(--game-w);height:var(--game-h);overflow:hidden;
  background:radial-gradient(120% 80% at 10% 0%,#2f78dd 0%,transparent 55%),radial-gradient(90% 70% at 100% 100%,rgba(229,50,45,.45) 0%,transparent 60%),#16428c}
#app::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 2px,transparent 2.5px);background-size:28px 28px}
#stage{position:absolute;left:50%;top:50%;width:720px;height:1280px;overflow:hidden;background:#F8EDD6;
  transform:translate(-50%,-50%);transform-origin:50% 50%}
#stage.framed{border-radius:30px;box-shadow:0 30px 90px rgba(0,0,0,.4)}
#scene{position:absolute;inset:0;z-index:1}
.bg{position:absolute;inset:0}
.bg svg{width:100%;height:100%;display:block}
#fx{position:absolute;inset:0;z-index:20;pointer-events:none}
#ui{position:absolute;inset:0;z-index:40;pointer-events:none}
#ui>*{pointer-events:auto}
#ui>.toast,#ui>.instr,#ui>.caption,#ui>.whisper,#ui>.shout,#ui>.bulb,#ui>.countdown,#ui>.stamp{pointer-events:none}
#dragLayer{position:absolute;inset:0;z-index:55;pointer-events:none}
#wipe{position:absolute;inset:0;z-index:70;pointer-events:none}
#wipe.on{pointer-events:auto}
#wipe i{position:absolute;left:50%;top:50%;width:1600px;height:1600px;margin:-800px 0 0 -800px;border-radius:50%;transform:scale(0)}
#wipe .w1{background:var(--yellow)}
#wipe .w2{background:var(--blue)}
#wipe .w3{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;opacity:0}
#copy{position:absolute;left:0;right:0;bottom:12px;text-align:center;z-index:66;pointer-events:none}
#copy span{display:inline-block;font:700 15px 'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;color:rgba(255,255,255,.92);background:rgba(20,32,70,.42);
  padding:4px 14px;border-radius:999px;letter-spacing:.3px;backdrop-filter:blur(3px)}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;height:116px;z-index:30;display:flex;align-items:center;gap:14px;
  padding:18px 118px 18px 20px;pointer-events:none;transition:transform .6s var(--smooth),opacity .5s}
#hud.hide{transform:translateY(-130%);opacity:0}
.hchip{background:#fff;border-radius:22px;min-width:104px;height:78px;display:grid;place-items:center;
  font:700 25px 'Fredoka','Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--blue);box-shadow:0 6px 0 rgba(0,0,0,.13);padding:0 14px;line-height:1}
.hchip small{display:block;font:800 13px 'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;color:#8a90a2;letter-spacing:1px;text-align:center;margin-bottom:3px}
.tmr{position:relative;width:62px;height:62px}
.tmr svg{width:62px;height:62px;transform:rotate(-90deg)}
.tmr circle{fill:none;stroke-width:7}
.tmr .tb{stroke:#EEF1F6}.tmr .tf{stroke:var(--red);stroke-linecap:round;stroke-dasharray:163.4;transition:stroke .3s}
.tmr b{position:absolute;inset:0;display:grid;place-items:center;font:700 26px 'Fredoka','Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink)}
.tmr.low b{color:var(--red);animation:pulse .5s ease-in-out infinite alternate}
#scoreBar{flex:1;background:#fff;border-radius:22px;padding:10px 18px 13px;box-shadow:0 6px 0 rgba(0,0,0,.13);min-width:0}
.mtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mlbl{display:flex;align-items:center;gap:6px;font:800 18px 'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;color:#5d6377;white-space:nowrap}
.mlbl svg{width:26px;height:26px}
.mval{font:700 27px 'Fredoka','Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--red);white-space:nowrap}
.mval small{font-size:19px;color:#9aa0b2}
.mtrack{height:20px;border-radius:12px;background:#EEF1F6;overflow:hidden;position:relative;margin-top:7px}
.mfill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:12px;background:linear-gradient(90deg,#FFC928,#FF8A2B);
  transition:width .8s var(--spring),background .4s}
.mfill::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.28) 0 10px,transparent 10px 20px);animation:barber 1s linear infinite}
@keyframes barber{to{background-position:28.28px 0}}
#scoreBar.full .mfill{background:linear-gradient(90deg,#3DD68C,#22B573)}
#scoreBar.full .mval{color:var(--green)}
#bgmBtn{position:absolute;right:20px;top:19px;z-index:68;width:84px;height:78px;border-radius:22px;background:#fff;
  box-shadow:0 6px 0 rgba(0,0,0,.13);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:transform .15s,box-shadow .15s}
#bgmBtn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.13)}
#bgmBtn svg{width:40px;height:34px}
#bgmBtn span{font:800 13px 'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:1px;color:var(--blue)}
#bgmBtn.off span{color:#9aa0b2}
#bgmBtn .eq rect{transform-box:fill-box;transform-origin:50% 100%;animation:eq .8s ease-in-out infinite alternate}
#bgmBtn .eq rect:nth-child(2){animation-delay:.25s}#bgmBtn .eq rect:nth-child(3){animation-delay:.5s}
@keyframes eq{0%{transform:scaleY(.3)}100%{transform:scaleY(1)}}
#bgmBtn.off .eq{display:none}#bgmBtn .x{display:none}#bgmBtn.off .x{display:inline}

/* ---------- Characters ---------- */
.chr{position:absolute;pointer-events:none;will-change:transform}
.chr svg{display:block;width:100%;height:auto;overflow:visible;transform-origin:50% 100%;transition:filter .6s}
.chr .upper{animation:breathe 3.6s ease-in-out infinite;animation-delay:var(--bd,0s)}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(2.4px)}}
.chr .head{transform-box:view-box;transform-origin:100px 150px;animation:tilt 6s ease-in-out infinite;animation-delay:var(--bd,0s)}
@keyframes tilt{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.8deg)}}
.chr .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite;animation-delay:var(--bd,0s)}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
.chr .arm{transform-box:view-box;transition:transform .65s var(--spring)}
.chr.talking .mouth{transform-box:fill-box;transform-origin:center;animation:talk .15s ease-in-out infinite alternate}
@keyframes talk{to{transform:scaleY(.3) scaleX(1.08)}}
.chr .sweat{transform-box:fill-box;animation:drip 1.5s ease-in infinite}
.chr .sweat.s2{animation-delay:.7s}
@keyframes drip{0%{transform:translateY(-4px);opacity:0}20%{opacity:1}100%{transform:translateY(18px);opacity:0}}
.chr .gloom{animation:gloom 1.1s ease-in-out infinite alternate}
@keyframes gloom{to{opacity:.3}}
.chr .prop{display:none}
.p-phone .prop-phone,.p-wallet .prop-wallet,.p-bag .prop-bag,.p-hold .prop-sos{display:inline}
.p-phone .armL{transform:rotate(-70deg)}
.p-wallet .armL{transform:rotate(-80deg)}.p-wallet .armR{transform:rotate(55deg)}
.p-bag .armL{transform:rotate(-55deg)}.p-bag .armR{transform:rotate(55deg)}
.p-hold .armL{transform:rotate(-55deg)}
.p-whisper .armR{transform:rotate(140deg)}
.p-point .armL{transform:rotate(85deg)}
.p-scratch .armR{transform:rotate(185deg);animation:scratch .28s ease-in-out .65s infinite alternate}
@keyframes scratch{from{transform:rotate(185deg)}to{transform:rotate(197deg)}}
.p-wave .armR{transform:rotate(-150deg);animation:wave 1s ease-in-out .6s infinite}
@keyframes wave{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-178deg)}}
.p-cheer .armR{transform:rotate(-165deg);animation:pump .5s ease-in-out .6s infinite alternate}
@keyframes pump{from{transform:rotate(-165deg)}to{transform:rotate(-150deg)}}
.p-panic .armL{transform:rotate(135deg);animation:flL .3s ease-in-out .5s infinite alternate}
.p-panic .armR{transform:rotate(-135deg);animation:flR .3s ease-in-out .5s infinite alternate}
@keyframes flL{from{transform:rotate(128deg)}to{transform:rotate(150deg)}}
@keyframes flR{from{transform:rotate(-128deg)}to{transform:rotate(-150deg)}}
.p-reach .armL{transform:rotate(160deg);animation:flL2 .45s ease-in-out .5s infinite alternate}
.p-reach .armR{transform:rotate(-160deg);animation:flR2 .45s ease-in-out .5s infinite alternate}
@keyframes flL2{from{transform:rotate(150deg)}to{transform:rotate(170deg)}}
@keyframes flR2{from{transform:rotate(-150deg)}to{transform:rotate(-170deg)}}
.p-hips .armL{transform:rotate(28deg)}.p-hips .armR{transform:rotate(-28deg)}
.chr.frozen svg{filter:saturate(.25) brightness(.8)}
.chr.dz-hover svg{filter:drop-shadow(0 0 8px #FFE07A) drop-shadow(0 0 20px #FFC928)}
.chr.dimmed svg{filter:brightness(.55) saturate(.5)}

/* ---------- Counter view ---------- */
.custZone{position:absolute;left:0;top:0;width:720px;height:610px;z-index:2}
.counterEdge{position:absolute;left:-10px;right:-10px;top:556px;height:50px;z-index:3;
  background:linear-gradient(#fbfcfd,#d3d9e0 45%,#a3adb9);box-shadow:0 8px 0 rgba(0,0,0,.07)}
.counterTop{position:absolute;left:0;right:0;top:606px;bottom:0;z-index:3;overflow:hidden;
  background:linear-gradient(180deg,#d5dbe2,#c4ccd5 35%,#d9dfe6 70%,#c2c9d2)}
.counterTop::before{content:'';position:absolute;inset:-50%;background:repeating-linear-gradient(115deg,transparent 0 160px,rgba(255,255,255,.35) 160px 190px,transparent 190px 340px);animation:sheen 14s linear infinite}
@keyframes sheen{to{transform:translateX(340px)}}
.grill{position:absolute;left:70px;top:664px;width:580px;height:330px;z-index:4}
.gsign{position:absolute;left:12px;right:12px;top:0;height:68px;border-radius:18px 18px 0 0;background:#fff;display:flex;align-items:center;overflow:hidden;box-shadow:inset 0 -4px 0 #ececec}
.gimg{width:150px;height:100%;background:linear-gradient(135deg,#F7A33B,#E5322D);display:flex;align-items:center;justify-content:center;gap:2px}
.gimg svg{width:42px;height:42px;transform:rotate(-20deg)}
.gimg svg+svg{transform:rotate(12deg)}
.gtxt{flex:1;text-align:center;font:700 38px 'Fredoka','Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--red);line-height:1}
.gtxt small{display:block;font:800 14px 'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;color:#a0a6b5;margin-top:4px;letter-spacing:.5px}
.gbody{position:absolute;left:0;right:0;top:62px;height:258px;border-radius:24px;background:linear-gradient(180deg,#f1f4f7,#b9c2cb);
  box-shadow:0 10px 0 #8d97a2,0 24px 34px rgba(0,0,0,.22)}
.bed{position:absolute;left:24px;right:24px;top:20px;height:200px;border-radius:14px;background:#3a4147}
.bed::before{content:'';position:absolute;inset:0;border-radius:14px;
  background:repeating-linear-gradient(180deg,#454c53 0px,#9aa3ab 6px,#eef1f4 10px,#a8b0b8 15px,#4a5158 20px,#2f353a 22px)}
.bed .heat{position:absolute;inset:0;border-radius:14px;background:radial-gradient(80% 60% at 50% 110%,rgba(255,120,40,.35),transparent 70%);animation:heat 2.2s ease-in-out infinite alternate}
@keyframes heat{to{opacity:.45}}
.bed.dz-hover{box-shadow:0 0 0 5px #FFC928,0 0 30px rgba(255,201,40,.7)}
.glass{position:absolute;left:14px;right:14px;top:6px;height:120px;border-radius:70px 70px 12px 12px/44px 44px 12px 12px;pointer-events:none;z-index:6;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.04) 80%)}
.glass::after{content:'';position:absolute;left:8%;top:14px;width:30%;height:10px;border-radius:10px;background:rgba(255,255,255,.75)}
.knobs{position:absolute;right:30px;bottom:9px;display:flex;gap:10px;align-items:center}
.knobs i{width:16px;height:16px;border-radius:50%;background:#59626b;box-shadow:inset 0 -3px 0 #3c434a}
.knobs b{width:10px;height:10px;border-radius:50%;background:#ff4d3d;box-shadow:0 0 10px #ff4d3d;animation:pulse 1s infinite alternate}
.sosis{position:absolute;width:230px;height:44px;border-radius:24px;touch-action:none;cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,.28),inset 0 -6px 8px rgba(0,0,0,.16),inset 0 5px 6px rgba(255,255,255,.3);animation:bob .55s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-2px)}}
.sosis .marks{position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(75deg,transparent 0 16px,rgba(70,22,6,.85) 16px 21px);
  opacity:var(--m,0);animation:roll 1s linear infinite}
@keyframes roll{to{background-position:21.74px 0}}
.sosis .badge{position:absolute;right:-12px;top:-15px;width:40px;height:40px;border-radius:50%;
  background:conic-gradient(#FFC928 calc(var(--p,0)*360deg),rgba(255,255,255,.9) 0);display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.sosis .badge::after{content:'';position:absolute;inset:6px;border-radius:50%;background:#fff}
.sosis .badge span{position:relative;z-index:1;font:700 21px 'Fredoka','Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;color:#fff;line-height:1}
.sosis.cooked{cursor:grab;animation:bob .55s ease-in-out infinite alternate,glowG 1s ease-in-out infinite alternate}
@keyframes glowG{to{box-shadow:0 5px 0 rgba(0,0,0,.28),0 0 0 4px rgba(61,214,140,.55),0 0 22px rgba(61,214,140,.6)}}
.sosis.cooked .badge,.sosis.cooked .badge::after{background:var(--green)}
.sosis.burning{cursor:grab;animation:shake .12s linear infinite}
.sosis.burning .badge,.sosis.burning .badge::after{background:var(--red)}
.sosis.burning .badge{animation:pulse .3s infinite alternate}
.sosis.lifted{opacity:.25}
.sosis.ghostS{animation:none;position:absolute;width:210px;height:42px}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-1px)}100%{transform:translate(1px,1px)}}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.12)}}
.tray{position:absolute;left:120px;top:1030px;width:480px;height:160px;z-index:4}
.trayBox{position:absolute;left:0;right:0;top:0;height:118px;border-radius:22px;background:linear-gradient(180deg,#eef1f4,#bdc5ce);
  box-shadow:0 8px 0 #8d97a2,inset 0 6px 0 rgba(255,255,255,.7);touch-action:none;cursor:grab;transition:transform .2s var(--spring)}
.trayBox:active{transform:scale(.97)}
.trayBox .rs{position:absolute;width:190px;height:38px;border-radius:20px;background:linear-gradient(180deg,#ffd0c9,#F4A096 50%,#d97b70);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.trayLbl{position:absolute;left:0;right:0;bottom:-6px;text-align:center;font:800 18px 'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;color:#5d6377}
.order{position:absolute;right:-8px;top:18px;background:#fff;border-radius:26px;padding:6px 16px 6px 6px;display:flex;align-items:center;gap:6px;
  font:700 32px 'Fredoka','Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.12)}
.order::after{content:'';position:absolute;left:24px;bottom:-12px;border:10px solid transparent;border-top-color:#fff}
.order .oi{position:relative;width:52px;height:52px;display:grid;place-items:center}
.order .oi svg{width:34px;height:34px}
.order .ring{position:absolute;left:6px;top:6px;width:52px;height:52px;transform:rotate(-90deg)}
.order .ring circle{fill:none;stroke-width:5}
.order .rb{stroke:#EEF1F6}.order .rf{stroke:var(--green);stroke-linecap:round;stroke-dasharray:125.66;transition:stroke .3s}
.order.nopat .ring{display:none}
.order.late .rf{stroke:var(--red)}
.order.late{animation:shake .25s linear infinite}

/* ---------- Aisle view ---------- */
.endcap{position:absolute;right:-10px;top:505px;width:280px;height:420px;z-index:3}
.endcap svg{width:100%;height:100%}

/* ---------- Bubbles ---------- */
.bubble{position:absolute;background:#fff;border-radius:32px;padding:30px 32px 32px;font:800 29px/1.4 'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);
  box-shadow:0 10px 0 rgba(0,0,0,.08),0 20px 44px rgba(20,30,70,.2);z-index:5}
.bubble .who{position:absolute;top:-24px;left:24px;background:var(--c);color:#fff;font:600 24px 'Fredoka','Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;padding:5px 18px 5px 6px;border-radius:999px;
  display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 rgba(0,0,0,.15);white-space:nowrap;max-width:calc(100% - 40px)}
.bubble .who .av{width:40px;height:40px;border-radius:50%;background:#fff;overflow:hidden;display:block;flex:none}
.bubble .who .av svg{width:100%;height:100%;display:block}
.bubble .who em{font:800 14px 'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-style:normal;background:rgba(255,255,255,.25);padding:3px 9px;border-radius:999px;letter-spacing:.5px}
.bubble .who.noav{padding-left:18px}
.bubble .tail{position:absolute;width:36px;height:36px;background:#fff;transform:rotate(45deg);border-radius:5px}
.bubble.t-down .tail{bottom:-15px;left:calc(var(--tx) - 18px)}
.bubble.t-up .tail{top:-15px;left:calc(var(--tx) - 18px)}
.bubble.t-none .tail{display:none}
.bubble .next{position:absolute;right:24px;bottom:8px;font-size:20px;color:#a6acbd;opacity:0;transition:opacity .25s}
.bubble .next.show{opacity:1;animation:nudge .8s ease-in-out infinite alternate}
@keyframes nudge{to{transform:translateY(5px)}}
.bubble .hl{color:var(--red)}
.bubble.me{background:#EAFBF4;box-shadow:0 10px 0 rgba(19,163,127,.18),0 20px 44px rgba(20,30,70,.2)}
.bubble.me .tail{background:#EAFBF4}
.bubble.think{background:#F1EEFF;border-radius:70px;padding:40px 44px 44px;font-style:italic;box-shadow:0 10px 0 rgba(123,108,246,.15),0 20px 44px rgba(20,30,70,.2)}
.bubble.think::before,.bubble.think::after{content:'';position:absolute;background:#F1EEFF;border-radius:50%;box-shadow:0 6px 0 rgba(123,108,246,.15)}
.bubble.think::before{width:40px;height:40px;left:50%;bottom:-48px}
.bubble.think::after{width:22px;height:22px;left:calc(50% + 34px);bottom:-82px}
.ch{opacity:0;transition:opacity .14s}
.ch.on{opacity:1}
.whisper{position:absolute;max-width:470px;background:rgba(58,36,92,.9);color:#f3eaff;border-radius:28px;padding:24px 26px 22px;font:800 26px/1.38 'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-style:italic;box-shadow:0 14px 40px rgba(20,0,40,.4);border:3px dashed rgba(255,255,255,.35);pointer-events:none;animation:float 3s ease-in-out infinite alternate}
.whisper .who{position:absolute;top:-22px;left:20px;display:flex;align-items:center;gap:6px;background:var(--c);color:#fff;font:600 20px 'Fredoka','Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-style:normal;padding:3px 14px 3px 4px;border-radius:999px}
.whisper .who .av{width:34px;height:34px;border-radius:50%;background:#fff;overflow:hidden;display:block}
.whisper .who .av svg{width:100%;height:100%;display:block}
.whisper .psst{position:absolute;right:-14px;top:-18px;background:var(--yellow);color:var(--ink);font:700 18px 'Fredoka','Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-style:normal;padding:4px 10px;border-radius:12px;transform:rotate(10deg)}
@keyframes float{from{translate:0 0;rotate:-1deg}to{translate:0 -10px;rotate:1deg}}

/* ---------- Panels / UI ---------- */
.backdrop{position:absolute;inset:0;background:rgba(18,28,64,.55);backdrop-filter:blur(3px)}
.panel{position:absolute;left:36px;right:36px;top:150px;max-height:1060px;overflow:auto;background:#fff;border-radius:38px;padding:44px 40px 40px;
  box-shadow:0 14px 0 rgba(0,0,0,.12),0 30px 80px rgba(0,0,0,.35);touch-action:pan-y;-webkit-overflow-scrolling:touch}
.panel h2{font:700 44px/1.1 'Fredoka','Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--blue);margin-bottom:10px}

#wipe .w1{background:#fff}
#wipe .w2{background:var(--yc) var(--pat) center/180px 140px}
#wipe .wlogo{position:absolute;left:50%;top:50%;width:400px;opacity:0;transform:translate(-50%,-50%) scale(0);filter:drop-shadow(0 12px 0 rgba(110,0,0,.25))}
/* HUD */
#hud{height:112px;padding:16px 118px 16px 18px}
.hlogo{height:78px;width:auto;filter:drop-shadow(0 5px 0 rgba(0,0,0,.12));pointer-events:none}
#hudTimer{margin-left:auto;min-width:0;height:78px;padding:0 18px 0 8px;display:flex;align-items:center;gap:8px}
#hudTimer .tl{font:800 17px var(--fn);color:#8a90a2;letter-spacing:.5px}
/* buttons & headings */
.btn{background:var(--yc);box-shadow:0 9px 0 var(--ycD)}
.btn:active{box-shadow:0 2px 0 var(--ycD)}
.panel h2{color:#C8161F}
/* start */
.start{background:var(--pat) 0 0/180px 140px,radial-gradient(80% 45% at 50% 20%,#FF4A4F 0%,#E61A23 60%,#C8121B 100%)}
.sTitle{top:96px}
.sLogo{display:block;width:430px;margin:0 auto;filter:drop-shadow(0 10px 0 rgba(110,0,0,.28))}
.sTitle h1{font:700 66px/1 var(--fd);margin-top:16px;letter-spacing:1px;text-shadow:0 6px 0 rgba(110,0,0,.3)}
.sTitle p{font:800 25px/1.35 var(--fn);opacity:1;color:#FFE08A;letter-spacing:.3px;margin-top:12px}
.sCard input:focus{border-color:var(--yc)}
/* grill sign */
.gimg{width:156px;background:var(--yc) var(--pat) 0 0/120px 94px}
.gimg img{width:136px;height:auto;filter:drop-shadow(0 3px 0 rgba(110,0,0,.25))}
/* tutorial */
.tut{top:300px;text-align:center;padding:40px 30px 36px}
.tutTop{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:28px}
.tutTop h2{margin:0}
.tChip{display:inline-flex;align-items:center;gap:8px;background:#FFF0F0;color:var(--yc);font:700 26px var(--fd);padding:6px 20px;border-radius:999px}
.tflow{display:flex;align-items:flex-start;justify-content:center;gap:4px}
.tf{flex:1;display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.tf .ti{width:146px;height:118px;border-radius:28px;background:#F5F7FB;display:grid;place-items:center;animation:tfb 2.4s ease-in-out infinite}
.tf:nth-child(3) .ti{animation-delay:.4s}.tf:nth-child(5) .ti{animation-delay:.8s}
@keyframes tfb{0%,70%,100%{transform:none}80%{transform:translateY(-10px)}90%{transform:translateY(0)}}
.tf .ti svg{width:116px;height:84px}
.tf b{font:700 26px/1.1 var(--fd);color:var(--ink)}
.tarr{flex:none;width:20px;height:20px;margin-top:48px;border-top:6px solid #cfd5e0;border-right:6px solid #cfd5e0;transform:rotate(45deg);border-radius:2px}
.twarn{display:inline-flex;align-items:center;gap:10px;margin-top:26px;background:#FFF3E0;color:#B5561A;font:800 24px var(--fn);padding:8px 22px 8px 10px;border-radius:999px}
.twarn svg{width:58px;height:42px}
/* drag guidance */
.guide{position:absolute;inset:0;pointer-events:none;transition:opacity .2s}
#dragLayer.dragging .guide{opacity:0}
.gsvg{position:absolute;left:0;top:0;width:720px;height:1280px;overflow:visible}
.gp1{fill:none;stroke:rgba(40,10,20,.32);stroke-width:18;stroke-linecap:round}
.gp2{fill:none;stroke:#fff;stroke-width:8;stroke-linecap:round;stroke-dasharray:.1 20;animation:gdash .5s linear infinite}
@keyframes gdash{to{stroke-dashoffset:-20.1}}
.gring{position:absolute;left:0;top:0;width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;border:5px dashed #fff;background:rgba(255,255,255,.16);
  box-shadow:0 0 0 6px rgba(230,26,35,.5),0 0 30px rgba(230,26,35,.4);animation:gpulse 1.1s ease-in-out infinite}
.gring.gB{width:180px;height:180px;margin:-90px 0 0 -90px;border-color:#FFE066;box-shadow:0 0 0 6px rgba(255,201,40,.55),0 0 34px rgba(255,201,40,.5)}
@keyframes gpulse{0%,100%{scale:1}50%{scale:1.08}}
.gring span{position:absolute;left:50%;top:calc(100% + 12px);transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:#fff;font:800 22px var(--fn);
  padding:7px 18px;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.2);animation:gpulse 1.1s ease-in-out infinite reverse}
.gring.up span{top:auto;bottom:calc(100% + 12px)}
.gring.gB span{background:var(--yc)}
.gitem{position:absolute;left:0;top:0;width:150px;height:32px;margin:-16px 0 0 -75px;border-radius:18px;opacity:0;
  background:linear-gradient(180deg,#ffd6cf,#F4A096 55%,#d97b70);box-shadow:0 10px 14px rgba(0,0,0,.25)}
.gitem.cooked{background:repeating-linear-gradient(75deg,transparent 0 14px,rgba(70,22,6,.7) 14px 18px),linear-gradient(180deg,#e7955f,#C9652F 55%,#8f3f18)}
.ghand{position:absolute;left:0;top:0;width:100px;height:100px;margin:-4px 0 0 -45px;opacity:0;filter:drop-shadow(0 8px 6px rgba(0,0,0,.3))}
.ghand svg{width:100%;height:100%;display:block}
/* coin pop */
.coin{background:radial-gradient(circle at 35% 30%,#fff3b0,#FFC928 45%,#e59a00)}
/* characters: hair behind the body */
.chr .headBack{transform-box:view-box;transform-origin:100px 150px;animation:tilt 6s ease-in-out infinite;animation-delay:var(--bd,0s)}
/* fail card */
.fail{top:350px;text-align:center;padding:40px 30px 34px}
.fail h2{font-size:48px}
.fpts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0 6px}
.fp{background:#FFF3F2;border-radius:26px;padding:22px 8px 20px;display:flex;flex-direction:column;align-items:center;gap:14px}
.fp i{width:98px;height:98px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 5px 0 rgba(229,50,45,.15)}
.fp i svg{width:62px;height:62px}
.fp b{font:700 25px/1.2 var(--fd);color:var(--ink)}
/* end */
.endCard .chipM{background:var(--yc)}
.endLogo{height:84px;width:auto;display:block;margin:0 auto 14px}
.endCard{top:96px;max-height:1134px}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="scene"></div>
    <div id="fx"></div>
    <div id="hud" class="hide">
      <img class="hlogo" data-logo alt="Yummy Choice">
      <div class="hchip" id="hudTimer" style="display:none"></div>
    </div>
    <button id="bgmBtn" aria-label="Musik latar on/off" title="BGM on/off">
      <svg viewBox="0 0 44 36"><path d="M4 13h7l9-8v26l-9-8H4z" fill="#1E5BC6"/><g class="eq" fill="#FFC928"><rect x="25" y="10" width="4" height="16" rx="2"/><rect x="31" y="6" width="4" height="24" rx="2"/><rect x="37" y="12" width="4" height="12" rx="2"/></g><g class="x" stroke="#E5322D" stroke-width="3.5" stroke-linecap="round"><path d="M27 12l12 12M39 12L27 24"/></g></svg>
      <span>BGM</span>
    </button>
    <div id="ui"></div>
    <div id="dragLayer"></div>
    <div id="wipe"><i class="w1"></i><i class="w2"></i><img class="wlogo" data-logo alt=""></div>
    <div id="copy"><span>© Education and Training Departement 2026</span></div>
  </div>
</div>

function setLogos(r){r.querySelectorAll('img[data-logo]').forEach(i=>{i.src=LOGO;});}
setLogos(document);

const stage=$('#stage'),sceneEl=$('#scene'),fxEl=$('#fx'),uiEl=$('#ui'),dragLayer=$('#dragLayer');
let SCALE=1;
function isTyping(){const a=document.activeElement;return !!a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA');}
function fit(force){
  if(!force&&isTyping())return;
  const box=$('#app').getBoundingClientRect(),W=box.width||innerWidth,H=box.height||innerHeight;
  const s=Math.min(W/720,H/1280);SCALE=s;
  stage.style.transform=`translate(-50%,-50%) scale(${s})`;
  stage.classList.toggle('framed',(W-720*s>10)||(H-1280*s>10));
}
addEventListener('resize',()=>fit());
if(window.ResizeObserver)new ResizeObserver(()=>fit()).observe($('#app'));
document.addEventListener('focusout',()=>setTimeout(()=>fit(true),350));
fit(true);
function toStage(cx,cy){const r=stage.getBoundingClientRect();return{x:(cx-r.left)/SCALE,y:(cy-r.top)/SCALE};}
function rectStage(el){const r=el.getBoundingClientRect(),s=stage.getBoundingClientRect();return{x:(r.left-s.left)/SCALE,y:(r.top-s.top)/SCALE,w:r.width/SCALE,h:r.height/SCALE};}

const S={name:'',target:12,goal:40,answers:['','',''],saved:12,burnt:0};
function fmt(t){return esc(t.replace(/\{name\}/g,S.name)).replace(/\*\*(.+?)\*\*/g,'<b class="hl">$1</b>');}

      const pe=q(.8),pc=[(ax+cx)/2*1,(ay+cy)/2];

      for(let i=1;i<=N;i++){const [x,y]=q(ease(i/N)),off=.22+(.78-.22)*i/N;handK.push({transform:`translate(${x}px,${y}px) scale(.88)`,opacity:1,offset:off});itemK.push({transform:`translate(${x}px,${y}px) scale(1) rotate(${(Math.sin(i/N*Math.PI)*-10).toFixed(1)}deg)`,opacity:1,offset:off});}

function splitChars(root){
  const spans=[];
  const walk=n=>{[...n.childNodes].forEach(ch=>{
    if(ch.nodeType===3){const frag=document.createDocumentFragment();for(const c of ch.textContent){const s=document.createElement('span');s.className='ch';s.textContent=c;frag.appendChild(s);spans.push(s);}ch.replaceWith(frag);}
    else walk(ch);
  });};
  walk(root);return spans;
}

   ========================================================= */
const Drag={
  zones:[],
  clear(){this.zones=[];},
  addZone(el,o){const z=Object.assign({el},o);this.zones.push(z);return z;},
  hit(cx,cy,p){
    for(const z of this.zones){
      if(!z.el.isConnected)continue;if(z.accept&&!z.accept(p))continue;
      const r=z.el.getBoundingClientRect(),pad=(z.pad||16)*SCALE;
      if(cx>=r.left-pad&&cx<=r.right+pad&&cy>=r.top-pad&&cy<=r.bottom+pad)return z;
    }return null;
  },
  source(el,o){el.addEventListener('pointerdown',e=>this.down(e,el,o));},
  down(e,el,o){
    if(e.button!=null&&e.button>0)return;
    if(o.can&&!o.can()){o.deny&&o.deny();return;}
    e.preventDefault();e.stopPropagation();
    const st={sx:e.clientX,sy:e.clientY,moved:false,ghost:null,p:null,hover:null,lx:0,rot:0};
    const pos=ev=>{
      const p=toStage(ev.clientX,ev.clientY);
      const vx=p.x-st.lx;st.lx=p.x;st.rot=st.rot*.8+clamp(vx*1.2,-22,22)*.2;
      st.ghost.style.left=p.x+'px';st.ghost.style.top=p.y+'px';
      st.ghost.style.transform=`translate(-50%,-50%) rotate(${st.rot.toFixed(1)}deg) scale(1.12)`;
      const z=this.hit(ev.clientX,ev.clientY,st.p);
      if(z!==st.hover){st.hover&&st.hover.el.classList.remove('dz-hover');z&&z.el.classList.add('dz-hover');st.hover=z;}
    };
    const start=ev=>{
      st.p=o.payload();st.ghost=o.ghost();st.ghost.style.position='absolute';st.ghost.style.zIndex=5;
      st.ghost.style.filter='drop-shadow(0 16px 12px rgba(0,0,0,.3))';
      dragLayer.appendChild(st.ghost);st.lx=toStage(ev.clientX,ev.clientY).x;
      o.onPick&&o.onPick(st.p);SFX.pop();dragLayer.classList.add('dragging');
    };
    const move=ev=>{
      if(!st.moved){if(Math.hypot(ev.clientX-st.sx,ev.clientY-st.sy)<8*SCALE)return;st.moved=true;start(ev);}
      pos(ev);
    };
    const up=ev=>{
      removeEventListener('pointermove',move);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
      if(!st.moved){o.onTap&&o.onTap();return;}
      dragLayer.classList.remove('dragging');
      st.hover&&st.hover.el.classList.remove('dz-hover');
      const z=ev.type==='pointercancel'?null:this.hit(ev.clientX,ev.clientY,st.p);
      const g=st.ghost;
      if(z&&z.drop(st.p)!==false){
        g.animate([{opacity:1},{opacity:0,transform:`translate(-50%,-50%) scale(.2)`}],{duration:240,easing:'ease-in',fill:'forwards'}).onfinish=()=>g.remove();
      }else{
        o.onCancel&&o.onCancel(st.p);
        const r=el.isConnected?rectStage(el):null;
        if(r)g.animate([{left:g.style.left,top:g.style.top},{left:(r.x+r.w/2)+'px',top:(r.y+r.h/2)+'px',transform:'translate(-50%,-50%) scale(1)'}],{duration:340,easing:EASE_SMOOTH,fill:'forwards'}).onfinish=()=>g.remove();
        else g.remove();
      }
    };
    addEventListener('pointermove',move);addEventListener('pointerup',up);addEventListener('pointercancel',up);
  }
};

const C_RAW=[244,160,150],C_COOK=[204,104,48],C_OVER=[112,52,24],C_BURN=[40,27,22];
const mix=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*k);
const rgb=(c,d=0)=>`rgb(${c.map(v=>clamp(Math.round(v+d),0,255)).join(',')})`;
const sosisBG=c=>`linear-gradient(180deg,${rgb(c,52)} 0%,${rgb(c,16)} 28%,${rgb(c)} 56%,${rgb(c,-40)} 100%)`;
class Grill{
  constructor(o={}){
    this.o=Object.assign({cook:3000,warn:6600,burn:8800,hold:false},o);
    this.slots=new Array(6).fill(null);this.frozen=false;
    this.el=h('div','grill',`<div class="gsign"><div class="gimg"><img src="${LOGO}" alt="Yummy Choice"></div><div class="gtxt">Sosis Bakar<small>GURIH · MAKYUS · KENYANG</small></div></div><div class="gbody"><div class="bed"><div class="heat"></div></div><div class="glass"></div><div class="knobs"><i></i><i></i><b></b></div></div>`,sceneEl);
    this.bed=this.el.querySelector('.bed');
    Drag.addZone(this.bed,{pad:30,accept:p=>p.type==='raw',drop:()=>this.placeRaw()});
  }
  pos(i){return{x:16+(i%2)*270,y:14+Math.floor(i/2)*64};}
  count(){return this.slots.filter(Boolean).length;}
  placeRaw(){
    const i=this.slots.indexOf(null);
    if(i<0){toast('Panggangan penuh! Angkat yang matang dulu.');this.bed.animate(shakeKF,{duration:320});SFX.bad();return false;}
    this.add(i,0);SFX.drop();this.onPlace&&this.onPlace();return true;
  }
  add(i,t,silent){
    const el=h('div','sosis raw',`<i class="marks"></i><b class="badge"><span></span></b>`,this.bed);
    const p=this.pos(i);el.style.left=p.x+'px';el.style.top=p.y+'px';
    const s={i,t,el,st:silent?'init':'raw',gone:false,drag:false};
    this.slots[i]=s;
    el.animate([{transform:'translateY(-70px) scale(.7)',opacity:0},{transform:'translateY(6px) scale(1.06,.88)',opacity:1,offset:.6},{transform:'none'}],{duration:460,easing:'ease-out'});
    Drag.source(el,{
      can:()=>!s.gone&&!this.frozen&&(s.st==='cooked'||s.st==='burning'),
      deny:()=>{if(!s.gone&&s.st==='raw'){floatTextAt(el,'Belum matang!','#E5322D');el.animate(shakeKF,{duration:320});}},
      payload:()=>({type:'cooked',s,grill:this}),
      ghost:()=>{const g=h('div','sosis ghostS','<i class="marks"></i>');g.style.background=el.style.background;g.style.setProperty('--m',el.style.getPropertyValue('--m'));return g;},
      onPick:()=>{s.drag=true;el.classList.add('lifted');},
      onCancel:()=>{s.drag=false;el.classList.remove('lifted');},
      onTap:()=>{this.onTapCooked&&this.onTapCooked(s);}
    });
    this.render(s);this.updSizzle();
    return s;
  }
  state(t){
    const o=this.o;
    if(t<o.cook){const k=t/o.cook,e=k*k*(3-2*k);return{c:mix(C_RAW,C_COOK,e),m:.6*k,p:k,st:'raw'};}
    if(o.hold||t<o.warn)return{c:C_COOK,m:.6,p:1,st:'cooked'};
    if(t<o.burn){const k=(t-o.warn)/(o.burn-o.warn);return{c:mix(C_COOK,C_OVER,k),m:.6+.3*k,p:k,st:'burning'};}
    return{c:C_BURN,m:.9,p:1,st:'burnt'};
  }
  render(s){
    const r=this.state(s.t);
    s.el.style.background=sosisBG(r.c);s.el.style.setProperty('--m',r.m.toFixed(2));s.el.style.setProperty('--p',r.p.toFixed(3));
    if(r.st!==s.st){
      const prev=s.st;s.st=r.st;
      s.el.classList.remove('raw','cooked','burning');s.el.classList.add(r.st);
      const sp=s.el.querySelector('.badge span');
      if(r.st==='cooked'){sp.textContent='✓';if(prev!=='init'){SFX.ready();s.el.querySelector('.badge').animate([{transform:'scale(.3)'},{transform:'scale(1.3)'},{transform:'scale(1)'}],{duration:420,easing:'ease-out'});}this.onCooked&&this.onCooked(s);}
      else if(r.st==='burning'){sp.textContent='!';}
      else if(r.st==='burnt')this.burn(s);
    }
  }
  burn(s){
    if(s.gone)return;s.gone=true;S.burnt++;
    const p=this.pos(s.i);
    for(let k=0;k<6;k++)setTimeout(()=>puff(this.bed,p.x+rand(30,200),p.y+20,'smoke'),k*60);
    floatTextAt(s.el,'Gosong!','#5a3a2a');SFX.burn();
    s.el.animate([{transform:'scale(1)',opacity:1,filter:'brightness(1)'},{transform:'scale(1.05,.8)',opacity:.9,filter:'brightness(.4)',offset:.3},{transform:'scale(.3,.2)',opacity:0}],{duration:750,easing:'ease-in',fill:'forwards'}).onfinish=()=>{s.el.remove();if(this.slots[s.i]===s)this.slots[s.i]=null;this.updSizzle();};
  }
  take(s){if(this.slots[s.i]===s)this.slots[s.i]=null;s.gone=true;s.el.remove();this.updSizzle();}
  firstCooked(){return this.slots.find(s=>s&&!s.gone&&(s.st==='cooked'||s.st==='burning'));}
  update(dt){
    if(this.frozen)return;
    for(const s of this.slots){
      if(!s||s.gone||s.drag)continue;
      s.t+=dt;this.render(s);
      if(!s.gone&&s.st!=='raw'&&Math.random()<dt/650){const p=this.pos(s.i);puff(this.bed,p.x+rand(30,200),p.y+10,s.st==='burning'?'smoke':'steam');}
    }
  }
  updSizzle(){AudioSys.sizzle(this.frozen?0:this.count());}
}

   CUSTOMERS
   ========================================================= */
class Cust{
  constructor(look,slot,o={}){
    this.o=o;this.want=o.want??1;this.got=0;this.pat=o.patience||0;this.patMax=this.pat;
    this.leaving=false;this.arrived=false;this.worried=false;this._res=null;
    this.key=o.key||('cu'+(++UID));
    this.c=addChar(this.key,slot,{look,parent:$('.custZone'),ex:o.ex||'smile',pose:o.pose});
    this.el=this.c.el;
    this.order=h('div','order'+(this.pat?'':' nopat'),`<span class="oi"><svg class="ring" viewBox="0 0 48 48"><circle class="rb" cx="24" cy="24" r="20"/><circle class="rf" cx="24" cy="24" r="20"/></svg>${o.icon||ICON.sosis}</span><b></b>`,this.el);
    this.order.querySelector('.ring').style.cssText='position:absolute;left:0;top:0;width:52px;height:52px;transform:rotate(-90deg)';
    this.order.style.display='none';
    this.setCount();
    Drag.addZone(this.el,{pad:6,accept:p=>p.type==='cooked'&&this.need(),drop:p=>{p.grill.take(p.s);this.serve();return true;}});
  }
  need(){return!this.leaving&&this.arrived&&this.got<this.want;}
  setCount(){this.order.querySelector('b').textContent=this.o.countText?this.o.countText(this):'×'+Math.max(0,this.want-this.got);}
  async walkIn(dir=1){await this.c.enter(dir>0?'walkR':'walkL');this.arrived=true;if(this.want>0)this.showOrder();}
  showOrder(){this.setCount();this.order.style.display='';this.order.animate([{transform:'scale(0) rotate(-10deg)',opacity:0},{transform:'scale(1.15)',opacity:1,offset:.7},{transform:'none'}],{duration:440,easing:'ease-out'});SFX.pop();}
  serve(){
    this.got++;SFX.coin();this.c.ex('happy');this.c.hop();this.setCount();
    if(this.o.onServe)this.o.onServe(this);else addTarget(1,this.el);
    if(this.got>=this.want){
      this.order.animate([{transform:'scale(1)'},{transform:'scale(0)',opacity:0}],{duration:250,fill:'forwards'});
      this.o.onDone&&this.o.onDone(this);
      if(this._res){const r=this._res;this._res=null;r();}
    }else setTimeout(()=>{if(!this.leaving)this.c.ex(this.worried?'worried':'smile');},700);
  }
  done(){return new Promise(r=>{if(this.want>0&&this.got>=this.want)r();else this._res=r;});}
  tick(dt){
    if(!this.arrived||this.leaving||!this.patMax||this.got>=this.want)return;
    this.pat-=dt;const k=clamp(this.pat/this.patMax,0,1);
    this.order.querySelector('.rf').style.strokeDashoffset=(125.66*(1-k)).toFixed(1);
    if(k<.35&&!this.worried){this.worried=true;this.c.ex('worried');this.order.classList.add('late');}
    if(this.pat<=0)this.angry();
  }
  async angry(){this.leaving=true;this.c.ex('annoyed');floatTextAt(this.el,'Kelamaan...','#6a7084');SFX.bad();this.order.remove();await sleep(550);await this.leave();}
  async leave(dir){this.leaving=true;const r=rectStage(this.el);await this.c.leave(dir||(r.x>250?'walkR':'walkL'));this.o.onGone&&this.o.onGone(this);}
}

  await tutorial();

  hudTimer(true);
  grill.frozen=false;

  const DUR=20;let tLeft=DUR,elapsed=0,running=true;
  const slots=[null,null],nextSpawn=[.3,2.4];let lastTick=99;
  let curHint=null,hintKind=null,lastAct=0,firstCook=true;
  const waiting=()=>slots.find(c=>c&&c.need());
  const clearHint=()=>{if(curHint)curHint();curHint=null;hintKind=null;};
  const showHint=kind=>{
    clearHint();
    if(kind==='raw'){if(grill.count()>=6)return;curHint=hint(tray.box,grill.bed,{from:'Tahan & seret',to:'Taruh di panggangan',item:'raw',toY:100,fromUp:true,toUp:true,bend:-40});}
    else{const s=grill.firstCooked(),c=waiting();if(!s||!c)return;curHint=hint(s.el,c.el,{from:'Tahan & seret',to:'Kasih ke konsumen',item:'cooked',toY:270});}
    hintKind=kind;
  };
  const acted=kind=>{lastAct=elapsed;if(hintKind===kind)clearHint();};
  grill.onPlace=()=>acted('raw');
  grill.onCooked=()=>{if(firstCook&&waiting()&&hintKind!=='raw'){firstCook=false;showHint('serve');}};
  grill.onTapCooked=async s=>{
    const c=waiting();
    if(!c){toast('Belum ada konsumen yang nunggu');return;}
    s.drag=true;const a=rectStage(s.el),b=rectStage(c.el);
    const g=h('div','sosis ghostS','<i class="marks"></i>',dragLayer);g.style.background=s.el.style.background;g.style.setProperty('--m',.6);s.el.classList.add('lifted');
    await g.animate([{left:(a.x+a.w/2)+'px',top:(a.y+a.h/2)+'px',transform:'translate(-50%,-50%) scale(1)'},{left:(b.x+b.w/2)+'px',top:(b.y+150)+'px',transform:'translate(-50%,-50%) scale(.3)'}],{duration:380,easing:EASE_SMOOTH,fill:'forwards'}).finished;

      onServe:cu=>{addTarget(1,cu.el);S.sold++;acted('serve');firstCook=false;},
      onDone:cu=>{floatTextAt(cu.el,pick(['Makasih!','Mantap!','Enak nih!']),'#22B573');setTimeout(()=>cu.leave(i?'walkR':'walkL'),500);},
      onGone:()=>{slots[i]=null;nextSpawn[i]=elapsed+rand(.7,1.4);}

      grill.update(dt*1000);

      if(curHint&&curHint.done){curHint=null;hintKind=null;}
      if(!curHint&&elapsed-lastAct>4&&tLeft>2.5){lastAct=elapsed;if(grill.firstCooked()&&waiting())showHint('serve');else showHint('raw');}

      if(tLeft<=0){running=false;resolve();return;}
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });

/* =========================================================

async function decision(){
  while(true){
    S.saved=S.target;
    AudioSys.setMood('tense');vig('tense');
    const c=await choose('Bu Jule menunggu jawabanmu...<small>Apa yang kamu lakukan, {name}?</small>'.replace('{name}',esc(S.name)),[
      {icon:'💸',text:'**Terima.** Proses pembelian Bu Jule, biar target aman.'},
      {icon:'✋',text:'**Tolak dengan sopan.** Ajak Bu Jule cek kondisinya dulu.'}
    ],{cls:'intense',top:230,backdrop:false});
    vig('dark');
    if(c===0){
      await pathAccept();
      await failCard();
      await wipe(async()=>{
        setView('aisle');vig('dark');S.target=S.saved;setHud(true);
        addChar('jule','left',{ex:'hopeful',pose:'wallet'});addChar('nura','right',{ex:'worried'});
      });
      await caption('Yuk, coba pikirkan lagi...',1600);
      continue;
    }
    await pathRefuse();
    return;
  }
}
async function pathAccept(){

      onServe:cu=>{const rem=S.goal-S.target,left=cu.want-cu.got+1;addTarget(Math.max(1,Math.ceil(rem/left)),cu.el);}});
  });
  await J.walkIn(-1);
  await say('jule','Makasih banyak ya, {name}! Masukin ke kantong saya aja semuanya.',{ex:'happy'});
  instruct('Seret semua sosis ke kantong Bu Jule','6×');
  let stop=hint(grill.slots[0].el,J.el,{to:'Masukkan ke kantong',item:'cooked',toY:270});

  await sleep(700);
  SFX.success();confetti(50);
  await caption('🎯 TARGET TERCAPAI!',1500);

  AudioSys.setMood('silence');

  await sleep(600);

/* =========================================================
   REFUSE → 3 pertanyaan rem
   ========================================================= */
async function pathRefuse(){
  AudioSys.setMood('doubt');vig(null);
  const J=cast.jule,N=cast.nura;
  await say('me','Bu... maaf sebelumnya. Kayaknya **jangan dibeli sendiri** deh, Bu.');
  await say('jule','Lho, kenapa? Kan targetnya jadi aman.',{ex:'shock',pose:'wallet'});
  await say('me','Angkanya memang aman, Bu. Tapi itu bukan penjualan beneran. Gimana kalau kita **rem dulu**, cek kondisinya, baru cari cara lain bareng-bareng?');
  await say('jule','Hmm... maksudnya gimana, {name}? Coba jelasin.',{ex:'think',pose:null});
  await brakeForm();
}
function brakeForm(){
  return new Promise(res=>{
    const Q=[
      ['Apa yang sebenarnya terjadi?','Fakta apa yang kamu lihat di toko hari ini?'],
      ['Apa yang harus dikejar (dan dijaga)?','Apa yang tetap harus dicapai? Apa yang nggak boleh dikorbankan?'],
      ['Langkah apa yang harus dilakukan?','Ide apa yang masuk akal, tanpa langgar SOP & tanpa korbankan tim?']
    ];
    const p=panel(`<div class="fTop"><div class="stopSign">REM</div><div><h2>Rem Dulu, ${esc(S.name)}!</h2><p>Sebelum ambil keputusan, cek 3 hal ini. Tulis singkat pakai bahasamu sendiri.</p></div></div>
      <div class="facts"><span>Yang kamu tahu sejauh ini:</span><i>📅 Sekolah libur</i><i>🛒 Toko lebih sepi</i><i>🗣️ Tim sudah menawarkan</i><i>⏰ Sudah mau sore</i></div>
      ${Q.map((q,i)=>`<div class="q" data-i="${i}"><b>${i+1}</b><div><h3>${q[0]}</h3><textarea maxlength="280" placeholder="${q[1]}"></textarea><div class="cnt">min. 10 karakter</div></div></div>`).join('')}
      <button class="btn green" disabled>Sampaikan ke Bu Jule</button>`,'form');
    const tas=[...p.querySelectorAll('textarea')],btn=p.querySelector('.btn');
    const chk=()=>{let all=true;tas.forEach((t,i)=>{const ok=t.value.trim().length>=10;const q=t.closest('.q');if(ok&&!q.classList.contains('ok')){q.querySelector('b').animate([{transform:'scale(1)'},{transform:'scale(1.3)'},{transform:'scale(1)'}],{duration:350});SFX.pop();}q.classList.toggle('ok',ok);q.querySelector('b').textContent=ok?'✓':i+1;q.querySelector('.cnt').textContent=ok?'Sip!':`${t.value.trim().length}/10 karakter`;if(!ok)all=false;});btn.disabled=!all;};
    tas.forEach(t=>t.addEventListener('input',chk));
    btn.onclick=async()=>{
      S.answers=tas.map(t=>t.value.trim());
      document.activeElement&&document.activeElement.blur();
      SFX.success();
      await closePanel(p);fit(true);res();
    };
  });
}
